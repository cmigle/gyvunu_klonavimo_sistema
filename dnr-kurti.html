<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DNR pavyzdžio kūrimo langas – Gyvūnų klonavimo sistema</title>
    <link rel="stylesheet" href="css/stilius.css">
    <script src="js/navigacija.js" defer></script>
</head>
<body>
    <nav class="meniu" id="meniu"></nav>
    <main style="--posistemes-spalva: var(--evelina)">
        <div class="antraste">
            <span class="posisteme">DNR pavyzdžio valdymas</span>
            <h1>DNR pavyzdžio kūrimo langas</h1>
        </div>
        <div id="pranesimas"></div>
        <form class="kortele" data-tikslas="dnr.html" data-pranesimas="DNR pavyzdys sukurtas." novalidate>
            <div class="tinklelis">
                <div class="laukas">
                    <label for="augintinis">Augintinis</label>
                    <select id="augintinis" name="augintinis">
                        <option value="">– pasirinkite –</option>

                    </select>
                </div>
                <div class="laukas">
                    <label for="paemimo_data">Paėmimo data</label>
                    <input id="paemimo_data" name="paemimo_data" type="date" required>
                </div>
                <div class="laukas">
                    <label for="saugojimo_temperatura">Saugojimo temperatūra (°C)</label>
                    <input id="saugojimo_temperatura" name="saugojimo_temperatura" type="number" required step="0.1">
                </div>
                <div class="laukas zymimasis">
                    <label><input type="checkbox" name="spausdinti_etikete"> Spausdinti pavyzdžio etiketę</label>
                </div>
            </div>
            <div class="mygtukai">
                <button type="submit" class="mygtukas">Sukurti</button>
            <a class="mygtukas antrinis" href="dnr.html">Atšaukti</a>
            </div>
        </form>
    </main>
    <footer>
        <div class="legenda">
            <span style="--c: var(--vytaute)">Vytautė Pratkevičiūtė</span>
            <span style="--c: var(--evelina)">Evelina Riukaitė</span>
            <span style="--c: var(--pijus)">Pijus Buknys</span>
            <span style="--c: var(--ugne)">Ugnė Čiauškaitė</span>
            <span style="--c: var(--migle)">Miglė Cirtautaitė</span>
        </div>
    </footer>
</body>
</html>
