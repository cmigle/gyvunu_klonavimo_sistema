<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DNR pavyzdžio ataskaitos langas – Gyvūnų klonavimo sistema</title>
    <link rel="stylesheet" href="css/stilius.css">
    <script src="js/duomenys.js" defer></script>
    <script src="js/navigacija.js" defer></script>
    <script src="js/langai.js" defer></script>
</head>
<body>
    <nav class="meniu" id="meniu"></nav>
    <main style="--posistemes-spalva: var(--evelina)" data-prieiga="specialistas">
        <header class="antraste">
            <div>
                <span class="posisteme">DNR pavyzdžio valdymas</span>
                <h1>DNR pavyzdžio ataskaitos langas</h1>
            </div>
        </header>
        <div id="pranesimas"></div>
        <div class="kortele">
            <div class="korteles-virsus"><h2>Pavyzdys <span data-f="kodas"></span></h2><span data-f="statusas"></span></div>
            <dl class="duomenys">
                <dt>Augintinis</dt><dd data-f="augintinis">–</dd>
                <dt>Paėmimo data</dt><dd data-f="paemimo_data">–</dd>
                <dt>Analizės data</dt><dd data-f="tinkamumo_data">–</dd>
                <dt>Neatitikimų skaičius</dt><dd data-f="neatitikimai">–</dd>
                <dt>Priskirtas statusas</dt><dd data-f="tinkamumas">–</dd>
            </dl>
        </div>
        <div class="kortele lenteles-kortele" id="patikrinimai">
            <div class="korteles-virsus"><h2>Biologinių parametrų patikrinimas</h2></div>
            <div class="slinktis">
                <table>
                    <thead><tr><th>Parametras</th><th class="skaicius">Vertė</th><th>Norma</th><th>Atitikimas</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
        <div class="kortele" id="isvada"></div>
        <div class="mygtukai">
            <button type="button" class="mygtukas" id="spausdinti">Spausdinti</button>
            <a class="mygtukas antrinis" href="dnr.html">Grįžti į sąrašą</a>
        </div>
    </main>
    <footer></footer>
</body>
</html>
