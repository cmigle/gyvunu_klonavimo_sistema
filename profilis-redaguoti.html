<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kliento profilio redagavimo langas – Gyvūnų klonavimo sistema</title>
    <link rel="stylesheet" href="css/stilius.css">
    <script src="js/duomenys.js" defer></script>
    <script src="js/navigacija.js" defer></script>
    <script src="js/langai.js" defer></script>
</head>
<body>
    <nav class="meniu" id="meniu"></nav>
    <main style="--posistemes-spalva: var(--migle)" data-prieiga="klientas">
        <header class="antraste">
            <div>
                <span class="posisteme">Kliento ir augintinio valdymas</span>
                <h1>Kliento profilio redagavimo langas</h1>
                <p class="aprasas">Pakeitus vardą, pavardę ar asmens kodą, teistumo istoriją reikės patikrinti iš naujo.</p>
            </div>
        </header>
        <div id="pranesimas"></div>
        <form class="kortele" id="profilio-forma">
            <div class="tinklelis">
                <div class="laukas">
                    <label for="vardas">Vardas</label>
                    <input id="vardas" name="vardas" type="text" required>
                </div>
                <div class="laukas">
                    <label for="pavarde">Pavardė</label>
                    <input id="pavarde" name="pavarde" type="text" required>
                </div>
                <div class="laukas">
                    <label for="el_pastas">El. paštas</label>
                    <input id="el_pastas" name="el_pastas" type="email" required>
                </div>
                <div class="laukas">
                    <label for="telefono_numeris">Telefono numeris</label>
                    <input id="telefono_numeris" name="telefono_numeris" type="tel" required pattern="\+?[0-9 ]{8,15}">
                </div>
                <div class="laukas">
                    <label for="asmens_kodas">Asmens kodas</label>
                    <input id="asmens_kodas" name="asmens_kodas" type="text" required pattern="[0-9]{11}" inputmode="numeric" title="11 skaitmenų">
                </div>
            </div>
            <div class="mygtukai">
                <button type="submit" class="mygtukas">Išsaugoti</button>
                <a class="mygtukas antrinis" href="profilis.html">Atšaukti</a>
            </div>
        </form>
    </main>
    <footer></footer>
</body>
</html>
