<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registracijos langas – Gyvūnų klonavimo sistema</title>
    <link rel="stylesheet" href="css/stilius.css">
    <script src="js/duomenys.js" defer></script>
    <script src="js/navigacija.js" defer></script>
    <script src="js/langai.js" defer></script>
</head>
<body>
    <nav class="meniu" id="meniu"></nav>
    <main class="centruotas" style="--posistemes-spalva: var(--migle)">
        <div class="prisijungimo-kortele platesne">
            <span class="posisteme">Kliento ir augintinio valdymas</span>
            <h1>Registracijos langas</h1>
            <p class="aprasas">Sukurkite kliento paskyrą.</p>
            <div id="pranesimas"></div>
            <form id="registracijos-forma">
                <div class="du-laukai">
                    <div class="laukas">
                        <label for="vardas">Vardas</label>
                        <input id="vardas" name="vardas" type="text" required autocomplete="given-name">
                    </div>
                    <div class="laukas">
                        <label for="pavarde">Pavardė</label>
                        <input id="pavarde" name="pavarde" type="text" required autocomplete="family-name">
                    </div>
                </div>
                <div class="laukas">
                    <label for="el_pastas">El. paštas</label>
                    <input id="el_pastas" name="el_pastas" type="email" required autocomplete="email">
                </div>
                <div class="du-laukai">
                    <div class="laukas">
                        <label for="telefono_numeris">Telefono numeris</label>
                        <input id="telefono_numeris" name="telefono_numeris" type="tel" required pattern="\+?[0-9 ]{8,15}" placeholder="+370 6xx xxxxx" autocomplete="tel">
                    </div>
                    <div class="laukas">
                        <label for="asmens_kodas">Asmens kodas</label>
                        <input id="asmens_kodas" name="asmens_kodas" type="text" required pattern="[0-9]{11}" inputmode="numeric" title="11 skaitmenų">
                    </div>
                </div>
                <div class="laukas">
                    <label for="slaptazodis">Slaptažodis</label>
                    <input id="slaptazodis" name="slaptazodis" type="password" required minlength="8" autocomplete="new-password">
                    <p class="pagalba">Ne mažiau kaip 8 simboliai.</p>
                </div>
                <div class="laukas">
                    <label for="slaptazodis2">Pakartokite slaptažodį</label>
                    <input id="slaptazodis2" name="slaptazodis2" type="password" required minlength="8" autocomplete="new-password">
                </div>
                <button type="submit" class="mygtukas platus">Registruotis</button>
            </form>
            <p class="apacioje">Jau turite paskyrą? <a href="prisijungimas.html">Prisijunkite</a></p>
        </div>
    </main>
    <footer></footer>
</body>
</html>
