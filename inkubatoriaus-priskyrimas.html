<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inkubatoriaus priskyrimo langas – Gyvūnų klonavimo sistema</title>
    <link rel="stylesheet" href="css/stilius.css">
    <script src="js/navigacija.js" defer></script>
</head>
<body>
    <nav class="meniu" id="meniu"></nav>
    <main style="--posistemes-spalva: var(--pijus)">
        <div class="antraste">
            <span class="posisteme">Inkubatorių valdymas</span>
            <h1>Inkubatoriaus priskyrimo langas</h1>
        </div>
        <div id="pranesimas"></div>
        <p class="kortele">Sistema automatiškai parinks tinkamiausią laisvą inkubatorių pagal embriono poreikius, būseną ir užimtumą.</p>
        <form class="kortele" data-tikslas="inkubatoriaus-priskyrimo-rezultatas.html" data-pranesimas="" novalidate>
            <div class="laukas">
                <label for="klonavimas">Klonavimo procesas</label>
                <select id="klonavimas" name="klonavimas">
                    <option value="">– pasirinkite –</option>

                </select>
            </div>
            <div class="mygtukai">
                <button type="submit" class="mygtukas">Priskirti automatiškai</button>
            <a class="mygtukas antrinis" href="inkubatoriai.html">Atšaukti</a>
            </div>
        </form>
    </main>
    <footer>
        <div class="legenda">
            <span style="--c: var(--vytaute)">Vytautė Pratkevičiūtė</span>
            <span style="--c: var(--evelina)">Evelina Riukaitė</span>
            <span style="--c: var(--pijus)">Pijus Buknys</span>
            <span style="--c: var(--ugne)">Ugnė Čiauškaitė</span>
            <span style="--c: var(--migle)">Miglė Cirtautaitė</span>
        </div>
    </footer>
</body>
</html>
