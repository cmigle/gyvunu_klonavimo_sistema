name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build --logger "console;verbosity=normal"

  smoke:
    name: Start against MySQL 8.4
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build src/GyvunuKlonavimoSistema -c Release
      - name: Start the application (creates the database from schema.sql)
        run: |
          dotnet run --project src/GyvunuKlonavimoSistema -c Release --no-build --urls http://127.0.0.1:5181 > app.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:5181/prisijungimas > /dev/null && exit 0; sleep 1; done
          cat app.log; exit 1
      - name: Check the database and pages
        run: |
          tables=$(mysql -h 127.0.0.1 -uroot -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'gyvunu_klonavimas'")
          echo "tables: $tables"; test "$tables" -eq 11
          curl -sf http://127.0.0.1:5181/ | grep -q "Pradžios langas"
          token=$(curl -s -c jar -b jar http://127.0.0.1:5181/prisijungimas | grep -o 'name="__RequestVerificationToken" type="hidden" value="[^"]*"' | sed 's/.*value="//;s/"$//')
          curl -s -o /dev/null -c jar -b jar --data-urlencode "ElPastas=laura@klonavimas.lt" --data-urlencode "Slaptazodis=demo1234" \
            --data-urlencode "__RequestVerificationToken=$token" http://127.0.0.1:5181/prisijungimas
          curl -sf -b jar http://127.0.0.1:5181/ | grep -q "Naujausi DNR pavyzdžiai"
      - if: failure()
        run: cat app.log
