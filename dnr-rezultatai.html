<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DNR pavyzdžio rezultatų įvedimo langas – Gyvūnų klonavimo sistema</title>
    <link rel="stylesheet" href="css/stilius.css">
    <script src="js/navigacija.js" defer></script>
</head>
<body>
    <nav class="meniu" id="meniu"></nav>
    <main style="--posistemes-spalva: var(--evelina)">
        <div class="antraste">
            <span class="posisteme">DNR pavyzdžio valdymas</span>
            <h1>DNR pavyzdžio rezultatų įvedimo langas</h1>
        </div>
        <div id="pranesimas"></div>
        <form class="kortele" data-tikslas="dnr-pavyzdys.html" data-pranesimas="Analizės rezultatai išsaugoti." novalidate>
            <div class="tinklelis">
                <div class="laukas">
                    <label for="dnr_koncentracija">DNR koncentracija (ng/µl)</label>
                    <input id="dnr_koncentracija" name="dnr_koncentracija" type="number" required step="0.01" min="0">
                </div>
                <div class="laukas">
                    <label for="tirpalo_turis">Tirpalo tūris (ml)</label>
                    <input id="tirpalo_turis" name="tirpalo_turis" type="number" required step="0.01" min="0">
                </div>
                <div class="laukas">
                    <label for="baltymu_tarsa">Baltymų tarša (A260/280)</label>
                    <input id="baltymu_tarsa" name="baltymu_tarsa" type="number" required step="0.01" min="0">
                </div>
                <div class="laukas">
                    <label for="din_verte">DIN vertė</label>
                    <input id="din_verte" name="din_verte" type="number" required step="0.01" min="0">
                </div>
                <div class="laukas">
                    <label for="lasteliu_gyvybingumas">Ląstelių gyvybingumas (%)</label>
                    <input id="lasteliu_gyvybingumas" name="lasteliu_gyvybingumas" type="number" required step="0.01" min="0">
                </div>
            </div>
            <div class="mygtukai">
                <button type="submit" class="mygtukas">Išsaugoti rezultatus</button>
            <a class="mygtukas antrinis" href="dnr-pavyzdys.html">Atšaukti</a>
            </div>
        </form>
    </main>
    <footer>
        <div class="legenda">
            <span style="--c: var(--vytaute)">Vytautė Pratkevičiūtė</span>
            <span style="--c: var(--evelina)">Evelina Riukaitė</span>
            <span style="--c: var(--pijus)">Pijus Buknys</span>
            <span style="--c: var(--ugne)">Ugnė Čiauškaitė</span>
            <span style="--c: var(--migle)">Miglė Cirtautaitė</span>
        </div>
    </footer>
</body>
</html>
