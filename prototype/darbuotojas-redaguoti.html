<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Darbuotojo redagavimo langas – Gyvūnų klonavimo sistema</title>
    <link rel="stylesheet" href="css/stilius.css">
    <script src="js/duomenys.js" defer></script>
    <script src="js/navigacija.js" defer></script>
    <script src="js/langai.js" defer></script>
</head>
<body>
    <nav class="meniu" id="meniu"></nav>
    <main style="--posistemes-spalva: var(--ugne)" data-prieiga="administratorius">
        <header class="antraste">
            <div>
                <span class="posisteme">Darbuotojų valdymas</span>
                <h1>Darbuotojo redagavimo langas</h1>
                <p class="aprasas" id="aprasas"></p>
            </div>
        </header>
        <div id="pranesimas"></div>
        <form class="kortele" id="darbuotojo-forma">
            <div class="tinklelis">
                <div class="laukas">
                    <label for="vardas">Vardas</label>
                    <input id="vardas" name="vardas" type="text" required>
                </div>
                <div class="laukas">
                    <label for="pavarde">Pavardė</label>
                    <input id="pavarde" name="pavarde" type="text" required>
                </div>
                <div class="laukas">
                    <label for="telefono_numeris">Telefono numeris</label>
                    <input id="telefono_numeris" name="telefono_numeris" type="tel" required pattern="\+?[0-9 ]{8,15}">
                </div>
                <div class="laukas">
                    <label for="el_pastas">El. paštas</label>
                    <input id="el_pastas" name="el_pastas" type="email" required>
                </div>
                <div class="laukas">
                    <label for="etatas">Etatas</label>
                    <input id="etatas" name="etatas" type="number" required step="0.25" min="0.25" max="1">
                    <p class="pagalba">Nuo 0,25 iki 1 (žingsnis 0,25).</p>
                </div>
                <div class="laukas">
                    <label for="role">Rolė (prieigos teisės)</label>
                    <select id="role" name="role" required>
                        <option value="">Pasirinkite…</option>
                        <option value="specialistas">Laboratorijos specialistas</option>
                        <option value="administratorius">Administratorius</option>
                    </select>
                </div>
            </div>
            <fieldset id="specialisto-laukai" hidden>
                <legend>Laboratorijos specialisto duomenys</legend>
                <div class="tinklelis">
                    <div class="laukas">
                        <label for="licencijos_numeris">Licencijos numeris</label>
                        <input id="licencijos_numeris" name="licencijos_numeris" type="text" required>
                    </div>
                    <div class="laukas">
                        <label for="busena">Būsena</label>
                        <select id="busena" name="busena" required>
                            <option value="true">Aktyvus</option>
                            <option value="false">Neaktyvus</option>
                        </select>
                    </div>
                </div>
            </fieldset>
            <div class="mygtukai">
                <button type="submit" class="mygtukas">Išsaugoti</button>
                <a class="mygtukas antrinis" href="darbuotojai.html">Atšaukti</a>
            </div>
        </form>
    </main>
    <footer></footer>
</body>
</html>
