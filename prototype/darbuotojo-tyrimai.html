<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Darbuotojo tyrimų sąrašo langas – Gyvūnų klonavimo sistema</title>
    <link rel="stylesheet" href="css/stilius.css">
    <script src="js/duomenys.js" defer></script>
    <script src="js/navigacija.js" defer></script>
    <script src="js/langai.js" defer></script>
</head>
<body>
    <nav class="meniu" id="meniu"></nav>
    <main style="--posistemes-spalva: var(--ugne)" data-prieiga="administratorius">
        <header class="antraste">
            <div>
                <span class="posisteme">Darbuotojų valdymas</span>
                <h1>Darbuotojo tyrimų sąrašo langas</h1>
                <p class="aprasas" id="aprasas"></p>
            </div>
            <div class="mygtukai">
                <label class="pasirinkimas">Specialistas <select id="specialisto-pasirinkimas"></select></label>
            </div>
        </header>
        <div id="pranesimas"></div>
        <div class="kortele lenteles-kortele">
            <div class="slinktis">
                <table>
                    <thead><tr><th>Nr.</th><th>Augintinis</th><th>Užsakymas</th><th>Pradžios data</th><th>Pabaigos data</th><th>Rezultatas</th><th>Būsena</th><th></th></tr></thead>
                    <tbody id="tyrimai"></tbody>
                </table>
            </div>
        </div>
        <div class="mygtukai">
            <a class="mygtukas antrinis" href="darbuotojai.html">Grįžti į darbuotojų sąrašą</a>
        </div>
    </main>
    <footer></footer>
</body>
</html>
