<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Augintinio redagavimo langas – Gyvūnų klonavimo sistema</title>
    <link rel="stylesheet" href="css/stilius.css">
    <script src="js/duomenys.js" defer></script>
    <script src="js/navigacija.js" defer></script>
    <script src="js/langai.js" defer></script>
</head>
<body>
    <nav class="meniu" id="meniu"></nav>
    <main style="--posistemes-spalva: var(--migle)" data-prieiga="klientas">
        <header class="antraste">
            <div>
                <span class="posisteme">Kliento ir augintinio valdymas</span>
                <h1>Augintinio redagavimo langas</h1>
                <p class="aprasas" id="aprasas"></p>
            </div>
        </header>
        <div id="pranesimas"></div>
        <form class="kortele" id="augintinio-forma">
            <div class="tinklelis">
                <div class="laukas">
                    <label for="vardas">Vardas</label>
                    <input id="vardas" name="vardas" type="text" required>
                </div>
                <div class="laukas">
                    <label for="veisle">Veislė</label>
                    <input id="veisle" name="veisle" type="text" required>
                </div>
                <div class="laukas">
                    <label for="tipas">Tipas</label>
                    <select id="tipas" name="tipas" required>
                        <option value="">Pasirinkite…</option>
                    </select>
                </div>
                <div class="laukas">
                    <label for="amzius">Amžius (metai)</label>
                    <input id="amzius" name="amzius" type="number" required min="0" max="100" step="1">
                </div>
                <div class="laukas">
                    <label for="lytis">Lytis</label>
                    <select id="lytis" name="lytis" required>
                        <option value="">Pasirinkite…</option>
                        <option value="Patinas">Patinas</option>
                        <option value="Patelė">Patelė</option>
                    </select>
                </div>
                <div class="laukas">
                    <label for="svoris">Svoris (kg)</label>
                    <input id="svoris" name="svoris" type="number" required min="0.01" step="0.01">
                </div>
                <div class="laukas">
                    <label for="mikroschemos_numeris">Mikroschemos numeris</label>
                    <input id="mikroschemos_numeris" name="mikroschemos_numeris" type="text" required pattern="[0-9]{15}" inputmode="numeric" title="15 skaitmenų (ISO 11784)">
                    <p class="pagalba">15 skaitmenų (ISO 11784).</p>
                </div>
            </div>
            <div class="mygtukai">
                <button type="submit" class="mygtukas">Išsaugoti</button>
                <a class="mygtukas antrinis" href="augintiniai.html">Atšaukti</a>
            </div>
        </form>
    </main>
    <footer></footer>
</body>
</html>
