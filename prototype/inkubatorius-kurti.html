<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Naujo inkubatoriaus kūrimo langas – Gyvūnų klonavimo sistema</title>
    <link rel="stylesheet" href="css/stilius.css">
    <script src="js/duomenys.js" defer></script>
    <script src="js/navigacija.js" defer></script>
    <script src="js/langai.js" defer></script>
</head>
<body>
    <nav class="meniu" id="meniu"></nav>
    <main style="--posistemes-spalva: var(--pijus)" data-prieiga="specialistas">
        <header class="antraste">
            <div>
                <span class="posisteme">Inkubatorių valdymas</span>
                <h1>Naujo inkubatoriaus kūrimo langas</h1>
                <p class="aprasas">Naujai sukurtas inkubatorius gauna būseną „Laisvas“.</p>
            </div>
        </header>
        <div id="pranesimas"></div>
        <form class="kortele" id="inkubatoriaus-forma">
            <div class="tinklelis">
                <div class="laukas">
                    <label for="modelis">Modelis</label>
                    <input id="modelis" name="modelis" type="text" required>
                </div>
                <div class="laukas">
                    <label for="serijinis_numeris">Serijinis numeris</label>
                    <input id="serijinis_numeris" name="serijinis_numeris" type="text" required>
                </div>
                <div class="laukas">
                    <label for="talpa">Talpa (l)</label>
                    <input id="talpa" name="talpa" type="number" required min="1" max="1000" step="0.1">
                </div>
            </div>
            <fieldset>
                <legend>Inkubavimo parametrai</legend>
                <div class="tinklelis">
                    <div class="laukas">
                        <label for="tiksline_temperatura">Tikslinė temperatūra (°C)</label>
                        <input id="tiksline_temperatura" name="tiksline_temperatura" type="number" required min="20" max="45" step="0.1">
                    </div>
                    <div class="laukas">
                        <label for="co2_procentas">CO₂ (%)</label>
                        <input id="co2_procentas" name="co2_procentas" type="number" required min="0" max="20" step="0.1">
                    </div>
                    <div class="laukas">
                        <label for="o2_procentas">O₂ (%)</label>
                        <input id="o2_procentas" name="o2_procentas" type="number" required min="1" max="21" step="0.1">
                    </div>
                    <div class="laukas">
                        <label for="ph_lygis">pH lygis</label>
                        <input id="ph_lygis" name="ph_lygis" type="number" required min="6" max="8.5" step="0.01">
                    </div>
                </div>
            </fieldset>
            <div class="mygtukai">
                <button type="submit" class="mygtukas">Sukurti</button>
                <a class="mygtukas antrinis" href="inkubatoriai.html">Atšaukti</a>
            </div>
        </form>
    </main>
    <footer></footer>
</body>
</html>
