<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Užsakymo redagavimo langas – Gyvūnų klonavimo sistema</title>
    <link rel="stylesheet" href="css/stilius.css">
    <script src="js/navigacija.js" defer></script>
</head>
<body>
    <nav class="meniu" id="meniu"></nav>
    <main style="--posistemes-spalva: var(--vytaute)">
        <div class="antraste">
            <span class="posisteme">Užsakymo valdymas</span>
            <h1>Užsakymo redagavimo langas</h1>
        </div>
        <div id="pranesimas"></div>
        <form class="kortele" data-tikslas="uzsakymas.html" data-pranesimas="Užsakymas sėkmingai atnaujintas." novalidate>
            <div class="tinklelis">
                <div class="laukas">
                    <label for="augintinis">Augintinis</label>
                    <select id="augintinis" name="augintinis">
                        <option value="">– pasirinkite –</option>

                    </select>
                </div>
                <div class="laukas">
                    <label for="pradzia">Pageidaujama klonavimo pradžia</label>
                    <input id="pradzia" name="pradzia" type="date" required>
                </div>
                <div class="laukas">
                    <label for="pastabos">Pastabos</label>
                    <textarea id="pastabos" name="pastabos" rows="3"></textarea>
                </div>
            </div>
            <div class="mygtukai">
                <button type="submit" class="mygtukas">Išsaugoti</button>
            <a class="mygtukas antrinis" href="uzsakymas.html">Atšaukti</a>
            </div>
        </form>
    </main>
    <footer>
        <div class="legenda">
            <span style="--c: var(--vytaute)">Vytautė Pratkevičiūtė</span>
            <span style="--c: var(--evelina)">Evelina Riukaitė</span>
            <span style="--c: var(--pijus)">Pijus Buknys</span>
            <span style="--c: var(--ugne)">Ugnė Čiauškaitė</span>
            <span style="--c: var(--migle)">Miglė Cirtautaitė</span>
        </div>
    </footer>
</body>
</html>
